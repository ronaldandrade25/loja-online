<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acompanhar pedido</title>
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><i class="fa-solid fa-bag-shopping"></i><span id="logo-nome">Loja Online</span></a>
    <span style="flex:1"></span>
    <a class="track-link" href="index.html"><i class="fa-solid fa-store"></i><span>Voltar à loja</span></a>
  </header>

  <main class="acomp">
    <h2>Acompanhar pedido</h2>
    <form class="acomp-busca" id="busca-form">
      <input id="codigo" placeholder="Código do pedido" maxlength="12" autocomplete="off" required />
      <button class="btn-principal">Consultar</button>
    </form>
    <p class="feedback erro" id="msg" role="alert"></p>
    <div id="resultado"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/acompanhar.js"></script>
</body>
</html>
