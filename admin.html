<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Loja Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest-admin.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/splash.css" />
</head>
<body>
  <div id="splash" aria-hidden="true"><div class="sp-logo"></div><div class="sp-nome"></div></div>
  <script>setTimeout(function () { var s = document.getElementById("splash"); if (s) s.classList.add("saindo"); }, 10000);</script>
  <!-- Login -->
  <div class="login" id="login">
    <form id="login-form">
      <h1><i class="fa-solid fa-lock"></i> Área administrativa</h1>
      <input type="email" id="email" placeholder="E-mail" autocomplete="username" autofocus required />
      <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required />
      <button class="btn" id="login-btn">Entrar</button>
      <button type="button" class="link" id="esqueci">Esqueci minha senha</button>
      <p class="erro" id="login-erro"></p>
      <button type="button" class="btn sec" id="instalar" hidden><i class="fa-solid fa-download"></i> Baixar o app</button>
      <a href="index.html">← Voltar à loja</a>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <div class="side-fundo" id="side-fundo" hidden></div>
    <aside class="side" id="side">
      <button type="button" class="side-toggle" id="side-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu"><i class="fa-solid fa-bars"></i></button>
      <h2 id="side-nome">Admin</h2>
      <nav id="menu">
        <button data-tab="dashboard" class="ativo"><i class="fa-solid fa-chart-line"></i> Dashboard</button>
        <button data-tab="pdv"><i class="fa-solid fa-cash-register"></i> PDV</button>
        <button data-tab="clientes"><i class="fa-solid fa-users"></i> Clientes</button>
        <button data-tab="pedidos"><i class="fa-solid fa-receipt"></i> Pedidos <span class="pill" id="pill-novos" hidden></span></button>
        <button data-tab="produtos"><i class="fa-solid fa-box"></i> Produtos</button>
        <button data-tab="estoque"><i class="fa-solid fa-boxes-stacked"></i> Estoque <span class="pill" id="pill-estoque" hidden></span></button>
        <button data-tab="categorias"><i class="fa-solid fa-tags"></i> Categorias</button>
        <button data-tab="fretes"><i class="fa-solid fa-truck-fast"></i> Fretes</button>
        <button data-tab="cupons"><i class="fa-solid fa-ticket"></i> Cupons</button>
        <button data-tab="pagar"><i class="fa-solid fa-file-invoice-dollar"></i> Contas a pagar <span class="pill" id="pill-vencidas" hidden></span></button>
        <button data-tab="receber"><i class="fa-solid fa-hand-holding-dollar"></i> Contas a receber</button>
        <button data-tab="relatorios"><i class="fa-solid fa-chart-pie"></i> Relatórios</button>
        <button data-tab="config"><i class="fa-solid fa-gear"></i> Configurações</button>
      </nav>
      <div class="side-foot">
        <a href="index.html" target="_blank" aria-label="Ver loja"><i class="fa-solid fa-arrow-up-right-from-square"></i><span class="rot">Ver loja</span></a>
        <button id="sair" aria-label="Sair"><i class="fa-solid fa-right-from-bracket"></i><span class="rot">Sair</span></button>
      </div>
    </aside>

    <main class="main">
      <section id="tab-dashboard" class="tab"></section>
      <section id="tab-pdv" class="tab" hidden></section>
      <section id="tab-clientes" class="tab" hidden></section>
      <section id="tab-pedidos" class="tab" hidden></section>
      <section id="tab-produtos" class="tab" hidden></section>
      <section id="tab-estoque" class="tab" hidden></section>
      <section id="tab-categorias" class="tab" hidden></section>
      <section id="tab-fretes" class="tab" hidden></section>
      <section id="tab-cupons" class="tab" hidden></section>
      <section id="tab-pagar" class="tab" hidden></section>
      <section id="tab-receber" class="tab" hidden></section>
      <section id="tab-relatorios" class="tab" hidden></section>
      <section id="tab-config" class="tab" hidden></section>
    </main>
  </div>

  <!-- Modal genérico de formulário -->
  <div class="modal" id="modal" hidden>
    <form class="modal-box" id="modal-form">
      <h3 id="modal-titulo"></h3>
      <div id="modal-campos"></div>
      <div class="acoes">
        <button type="button" class="btn sec" id="modal-cancelar">Cancelar</button>
        <button class="btn" id="modal-salvar">Salvar</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/admin-impressao.js"></script>
  <script src="js/admin-config.js"></script>
  <script src="js/admin-clientes.js"></script>
  <script src="js/admin-estoque.js"></script>
  <script src="js/admin-camera.js"></script>
  <script src="js/admin-pdv.js"></script>
  <script src="js/admin-financeiro.js"></script>
  <script src="js/admin-relatorios.js"></script>
</body>
</html>
